[project]
name = "quran-recitation-server"
version = "0.1.0"
description = "Real-time Quran recitation tracking server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "silero-vad>=5.1",
    "onnxruntime>=1.17.0",
    "panphon>=0.20",
    "httpx>=0.28.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
wav2vec2 = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "phonemizer>=3.2.0",
    "pyctcdecode>=0.5.0",
]
nemo = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "nemo_toolkit[asr]>=2.0.0",
]
whisper = ["faster-whisper>=1.0.0"]
deepfilter = ["deepfilternet>=0.5.0", "scipy>=1.12.0"]
opus = ["opuslib>=3.0.0"]
muaalem = [
    "quran-muaalem>=0.1.0",
    "librosa>=0.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: full pipeline integration tests requiring ML models",
    "slow: tests that take >10s to run",
    "benchmark: ASR engine benchmark tests",
]
