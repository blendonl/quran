name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,wav2vec2]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: >-
          python -m pytest -m "not integration and not benchmark"
          --deselect tests/test_improvements.py::TestConsecutiveFailures::test_mistake_after_threshold
          --deselect tests/test_improvements.py::TestRemainingLettersNotSure::test_remaining_letters_are_not_sure

  mobile:
    name: Mobile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn workspace mobile test --ci
